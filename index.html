<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Looks – Virtual Hairstyle Try-On</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Looks">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

    <!-- SEO -->
    <meta name="description" content="Try on hairstyles instantly with AI. See your new look before you book.">
    <meta property="og:title" content="Looks – Virtual Hairstyle Try-On">
    <meta property="og:description" content="Try on hairstyles instantly with AI.">
    <meta property="og:image" content="/assets/icons/icon-512x512.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    
    <style>
/* ============================================ */
/* SNAPCHAT-STYLE FULL SCREEN CAMERA */
/* ============================================ */

:root {
    --accent-color: #0ea5e9;
    --success-color: #059669;
}

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: #000;
    color: white;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
    -webkit-user-select: none;
    user-select: none;
}

/* FULL SCREEN CAMERA */
#camera-viewport {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 1;
}

#video-feed, #ai-result {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

#video-feed.active { display: block; }
#ai-result.active { display: block; }

#camera-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
}

#camera-placeholder.hidden { display: none; }

.placeholder-icon {
    font-size: 80px;
    opacity: 0.3;
}

/* TOP BAR */
#top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    padding-top: env(safe-area-inset-top);
}

.gender-toggle {
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 4px;
}

.gender-btn {
    padding: 8px 20px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.7);
    border-radius: 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.gender-btn.active {
    background: rgba(255,255,255,0.3);
    color: white;
}

.filter-btn {
    padding: 8px 16px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

/* CAPTURE BUTTON */
#capture-button {
    position: fixed;
    bottom: 220px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid white;
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
    z-index: 90;
    cursor: pointer;
    transition: transform 0.1s;
}

#capture-button:active {
    transform: translateX(-50%) scale(0.9);
}

#capture-button.hidden { display: none; }

/* ACTION BUTTONS */
#action-buttons {
    position: fixed;
    bottom: 220px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 90;
}

.action-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: transform 0.1s;
    display: none;
}

.action-btn.visible { display: block; }
.action-btn:active { transform: scale(0.95); }

#generate-btn {
    background: var(--success-color);
    color: white;
}

#redo-btn {
    background: rgba(255,255,255,0.2);
    color: white;
}

#book-btn {
    background: var(--accent-color);
    color: white;
}

/* BOTTOM STYLE GALLERY */
#style-gallery {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
}

.gallery-label {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.6;
    margin: 12px 0 8px 0;
}

.style-scroll {
    display: flex;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    gap: 16px;
    padding: 0 calc(50vw - 45px);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.style-scroll::-webkit-scrollbar { display: none; }

.style-item {
    flex-shrink: 0;
    width: 90px;
    scroll-snap-align: center;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 0.5;
    transform: scale(0.85);
}

.style-item.selected {
    opacity: 1;
    transform: scale(1);
}

.style-thumbnail {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    border: 3px solid transparent;
    transition: border 0.3s;
}

.style-item.selected .style-thumbnail {
    border-color: var(--accent-color);
    box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
}

/* STATUS MESSAGE */
#status-message {
    position: fixed;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 95;
    backdrop-filter: blur(10px);
    text-align: center;
    max-width: 80%;
}

/* LOADING SPINNER */
.spinner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    z-index: 200;
    display: none;
}

.spinner.active { display: block; }

@keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* FILTERS MODAL */
#filters-modal {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 20px 20px 0 0;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 150;
    transform: translateY(100%);
    transition: transform 0.3s;
}

#filters-modal.open { transform: translateY(0); }

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-title {
    font-size: 18px;
    font-weight: 600;
}

.close-btn {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.filter-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.7;
    margin-bottom: 12px;
}

.complexion-options {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.complexion-tile {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: border 0.2s;
}

.complexion-tile.selected {
    border-color: var(--accent-color);
    box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
}
    </style>
</head>
<body>
    <!-- CAMERA -->
    <div id="camera-viewport">
        <div id="camera-placeholder">
            <div class="placeholder-icon">📷</div>
        </div>
        <video id="video-feed" autoplay playsinline></video>
        <img id="ai-result" alt="AI Result">
    </div>

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="gender-toggle">
            <button class="gender-btn active" data-gender="male">Male</button>
            <button class="gender-btn" data-gender="female">Female</button>
        </div>
        <button class="filter-btn" id="filter-btn">+ Filters</button>
    </div>

    <!-- CAPTURE BUTTON -->
    <button id="capture-button"></button>

    <!-- ACTION BUTTONS -->
    <div id="action-buttons">
        <button class="action-btn" id="redo-btn">🔄</button>
        <button class="action-btn" id="generate-btn">✨ Generate</button>
        <button class="action-btn" id="book-btn">✂️ Book</button>
    </div>

    <!-- STATUS -->
    <div id="status-message">Starting camera...</div>

    <!-- SPINNER -->
    <div class="spinner" id="spinner"></div>

    <!-- STYLE GALLERY -->
    <div id="style-gallery">
        <div class="gallery-label">Swipe to browse</div>
        <div class="style-scroll" id="male-styles"></div>
        <div class="style-scroll" id="female-styles" style="display:none;"></div>
    </div>

    <!-- FILTERS MODAL -->
    <div id="filters-modal">
        <div class="modal-header">
            <div class="modal-title">Filters</div>
            <button class="close-btn" id="close-filters">&times;</button>
        </div>
        <div class="filter-label">Complexion</div>
        <div class="complexion-options">
            <div class="complexion-tile" style="background:#F8D7BE" data-code="default"></div>
            <div class="complexion-tile" style="background:#D6A476" data-code="default"></div>
            <div class="complexion-tile" style="background:#A97A52" data-code="ds"></div>
            <div class="complexion-tile" style="background:#6A3E26" data-code="ds"></div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
// Analytics & Tracking
const sessionId = `session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('shop') || 'instagram';
const validShops = ['wyckoff', 'wyckoff-ig', 'allendale', 'montana', 'virile', 'maple-w', 'ridgewood', 'instagram'];
const trackingEnabled = validShops.includes(shopId);

let userId = localStorage.getItem('looks_user_id');
let isReturning = false;

if (userId) {
    isReturning = true;
} else {
    userId = `user_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
    localStorage.setItem('looks_user_id', userId);
}

async function track(eventType, data = {}) {
    if (!trackingEnabled) return;
    try {
        await fetch('/api/analytics', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                eventType,
                eventData: { 
                    sessionId,
                    user_id: userId,
                    is_returning: isReturning,
                    shop_id: shopId,
                    ...data 
                }
            })
        });
    } catch (e) { 
        console.error('Track failed:', e); 
    }
}

// Track session start
if (trackingEnabled) {
    setTimeout(() => {
        fetch('/api/analytics', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                eventType: 'session_start',
                eventData: { 
                    sessionId,
                    user_id: userId,
                    is_returning: isReturning,
                    shop_id: shopId,
                    gender: 'Male' 
                }
            })
        });
    }, 1000);
}

// DOM Elements
const videoFeed = document.getElementById('video-feed');
const aiResult = document.getElementById('ai-result');
const canvas = document.getElementById('canvas');
const placeholder = document.getElementById('camera-placeholder');
const captureBtn = document.getElementById('capture-button');
const redoBtn = document.getElementById('redo-btn');
const generateBtn = document.getElementById('generate-btn');
const bookBtn = document.getElementById('book-btn');
const statusMsg = document.getElementById('status-message');
const spinner = document.getElementById('spinner');
const maleStyles = document.getElementById('male-styles');
const femaleStyles = document.getElementById('female-styles');
const filterBtn = document.getElementById('filter-btn');
const filtersModal = document.getElementById('filters-modal');
const closeFilters = document.getElementById('close-filters');

// State
let capturedImage = null;
let selectedPrompt = null;
let selectedStyleLabel = null;
let cameraStarted = false;
let imageCaptured = false;
let aiComplete = false;
let selectedGender = 'Male';
let selectedComplexionCode = null;

const NEGATIVE_PROMPT = "extra fingers, blurry, low resolution, bad hands, deformed face, mask artifact, bad blending, unnatural hair color, ugly, tiling, duplicate, abstract, cartoon, distorted pupils, bad lighting, cropped, grainy, noise, poor lighting, poor composition, low quality, changed clothing, changed background, new outfit, new background, different lighting";

// Booking URLs
const bookingUrls = {
    'wyckoff': 'https://www.vagaro.com/wyckoffavebarbershop/book-now',
    'wyckoff-ig': 'https://www.vagaro.com/wyckoffavebarbershop/book-now',
};

// Camera Functions
async function startCamera() {
    if (cameraStarted) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } }
        });
        videoFeed.srcObject = stream;
        await videoFeed.play();
        videoFeed.classList.add('active');
        placeholder.classList.add('hidden');
        cameraStarted = true;
        statusMsg.textContent = 'Tap circle to capture';
        captureBtn.classList.remove('hidden');
    } catch (e) {
        console.error('Camera error:', e);
        statusMsg.textContent = 'Camera access denied';
    }
}

function stopCamera() {
    if (videoFeed.srcObject) {
        videoFeed.srcObject.getTracks().forEach(t => t.stop());
        videoFeed.srcObject = null;
    }
    cameraStarted = false;
}

function captureImage() {
    const ctx = canvas.getContext('2d');
    canvas.width = videoFeed.videoWidth || 1280;
    canvas.height = videoFeed.videoHeight || 1280;
    ctx.drawImage(videoFeed, 0, 0);
    capturedImage = canvas.toDataURL('image/jpeg').split(',')[1];
    
    aiResult.src = `data:image/jpeg;base64,${capturedImage}`;
    aiResult.classList.add('active');
    videoFeed.classList.remove('active');
    
    imageCaptured = true;
    stopCamera();
    updateUI();
    
    if (trackingEnabled) track('image_capture');
}

async function generateLook() {
    if (!capturedImage || !selectedPrompt) return;
    
    spinner.classList.add('active');
    statusMsg.textContent = 'Generating your look...';
    
    const complexionClause = selectedComplexionCode === 'ds' ? ' with a darkest complexion' : '';
    const finalPrompt = `STRICTLY operate in an inpainting/editing mode. The ONLY element to be changed is the subject's hair. PRESERVE the subject's face, identity, expression, clothing, and background EXACTLY as they appear in the original photograph. Apply the following hairstyle, matching its texture, color, and shape: ${selectedPrompt}. The final result must be a high quality, professional studio portrait of a ${selectedGender} model${complexionClause} with NO other changes besides the hair.`;
    
    try {
        const response = await fetch('/api/run_model', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                baseImage: capturedImage,
                prompt: finalPrompt,
                negativePrompt: NEGATIVE_PROMPT
            })
        });
        
        if (!response.ok) throw new Error('Generation failed');
        
        const data = await response.json();
        aiResult.src = `data:image/jpeg;base64,${data.generatedImageBase64}`;
        capturedImage = data.generatedImageBase64;
        
        aiComplete = true;
        spinner.classList.remove('active');
        statusMsg.textContent = 'Love it? Book now!';
        updateUI();
        
        if (trackingEnabled) track('generation_complete', { styleLabel: selectedStyleLabel });
    } catch (e) {
        console.error('Generate error:', e);
        spinner.classList.remove('active');
        statusMsg.textContent = 'Error generating. Try again.';
    }
}

function resetSession() {
    stopCamera();
    aiResult.classList.remove('active');
    placeholder.classList.remove('hidden');
    imageCaptured = false;
    aiComplete = false;
    capturedImage = null;
    updateUI();
    startCamera();
}

function updateUI() {
    captureBtn.classList.toggle('hidden', imageCaptured);
    redoBtn.classList.toggle('visible', imageCaptured);
    generateBtn.classList.toggle('visible', imageCaptured && selectedPrompt && !aiComplete);
    bookBtn.classList.toggle('visible', aiComplete);
}

// Load Female Styles (hardcoded)
const femaleStylesData = [
    { src: 'styles/female/style1.png', prompt: 'A shoulder-length cut with soft waves and natural volume, warm brunette color, gentle face-framing layers.', label: 'Soft Wavy Layers' },
    { src: 'styles/female/style2.png', prompt: 'A long layered hairstyle with loose curls, dark brown color, flowing and romantic silhouette.', label: 'Long Loose Curls' },
    { src: 'styles/female/style3.png', prompt: 'A sleek straight bob cut at chin length, jet black color, sharp and modern profile.', label: 'Sleek Chin Bob' },
    { src: 'styles/female/style4.png', prompt: 'A textured lob with subtle waves, ash blonde color, effortless and airy finish.', label: 'Textured Wavy Lob' },
    { src: 'styles/female/style5.png', prompt: 'A short pixie cut with choppy layers, platinum blonde color, bold and edgy look.', label: 'Choppy Pixie Cut' },
    { src: 'styles/female/style6.png', prompt: 'A long haircut with smooth straight strands, rich chestnut color, polished and elegant feel.', label: 'Long Sleek Layers' },
    { src: 'styles/female/style7.png', prompt: 'A curly shoulder-length style with defined ringlets, deep black color, lively and full shape.', label: 'Defined Curly Cut' },
    { src: 'styles/female/style8.png', prompt: 'A layered shag cut with curtain bangs, honey brown color, relaxed and trendy vibe.', label: 'Layered Shag Cut' },
];

femaleStylesData.forEach(style => {
    const div = document.createElement('div');
    div.className = 'style-item';
    div.innerHTML = `<img class="style-thumbnail" src="${style.src}" alt="${style.label}">`;
    div.dataset.prompt = style.prompt;
    div.dataset.label = style.label;
    div.addEventListener('click', () => selectStyle(div));
    femaleStyles.appendChild(div);
});

// Load Male Styles from JSON
fetch('/styles-data.json')
    .then(r => r.json())
    .then(data => {
        const styles = data.filter(s => s.gender === 'male');
        const shuffled = styles.sort(() => Math.random() - 0.5);
        
        shuffled.forEach(style => {
            const div = document.createElement('div');
            div.className = 'style-item';
            div.innerHTML = `<img class="style-thumbnail" src="${style.thumbnail_path}" alt="${style.name}">`;
            div.dataset.prompt = style.prompt;
            div.dataset.label = style.name;
            div.dataset.code = style.complexion;
            div.addEventListener('click', () => selectStyle(div));
            maleStyles.appendChild(div);
        });
        
        // Auto-select first
        if (maleStyles.firstChild) {
            selectStyle(maleStyles.firstChild);
        }
    })
    .catch(e => console.error('Styles load error:', e));

function selectStyle(item) {
    const container = item.parentElement;
    container.querySelectorAll('.style-item').forEach(i => i.classList.remove('selected'));
    item.classList.add('selected');
    
    selectedPrompt = item.dataset.prompt;
    selectedStyleLabel = item.dataset.label;
    
    // Scroll to center
    item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    
    updateUI();
}

// Gender Toggle
document.querySelectorAll('.gender-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedGender = btn.dataset.gender === 'male' ? 'Male' : 'Female';
        
        if (selectedGender === 'Male') {
            maleStyles.style.display = 'flex';
            femaleStyles.style.display = 'none';
        } else {
            maleStyles.style.display = 'none';
            femaleStyles.style.display = 'flex';
        }
        
        if (imageCaptured) resetSession();
    });
});

// Filters Modal
filterBtn.addEventListener('click', () => filtersModal.classList.add('open'));
closeFilters.addEventListener('click', () => filtersModal.classList.remove('open'));

document.querySelectorAll('.complexion-tile').forEach(tile => {
    tile.addEventListener('click', () => {
        document.querySelectorAll('.complexion-tile').forEach(t => t.classList.remove('selected'));
        tile.classList.add('selected');
        selectedComplexionCode = tile.dataset.code;
    });
});

// Button Events
captureBtn.addEventListener('click', captureImage);
redoBtn.addEventListener('click', resetSession);
generateBtn.addEventListener('click', generateLook);
bookBtn.addEventListener('click', () => {
    const url = bookingUrls[shopId];
    if (url) {
        if (trackingEnabled) track('booking_click', { styleLabel: selectedStyleLabel });
        window.open(url, '_blank');
    } else {
        statusMsg.textContent = 'Booking unavailable';
    }
});

// Auto-start camera
startCamera();
    </script>
</body>
</html>
